
name: Daily Timesheet Automation

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Choose automation mode'
        required: true
        type: choice
        default: test
        options:
          - test
          - live

permissions:
  contents: read

jobs:
  timesheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      TS_USER: ${{ secrets.TS_USER }}
      TS_PASS: ${{ secrets.TS_PASS }}
      TS_DISPLAY_NAME: ${{ secrets.TS_DISPLAY_NAME }}
      TASK_SOURCE_URL: ${{ secrets.TASK_SOURCE_URL }}

      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright python-dotenv

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Verify Playwright
        run: |
          python -c "import playwright; print('Playwright installed successfully')"
          python -m playwright --version

      # TEST MODE: Sends test email and Telegram notification only.
      # Does NOT execute timesheet automation.
      - name: Test Email and Telegram Notifications
        if: ${{ inputs.run_mode == 'test' }}
        run: python timesheet.py mailtest

      # LIVE MODE: Runs the actual timesheet automation.
      - name: Run Timesheet Automation
        if: ${{ inputs.run_mode == 'live' }}
        run: python timesheet.py hide

      - name: Upload Timesheet Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timesheet-debug
          path: |
            form_debug.txt
            form_debug.png
            debug_page.txt
            debug_page.png
            timesheet.log
          if-no-files-found: ignore
          retention-days: 7
