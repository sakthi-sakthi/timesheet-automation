
name: Daily Timesheet Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timesheet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright python-dotenv

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Verify Playwright
        run: |
          python -c "import playwright; print('Playwright installed successfully')"
          python -m playwright --version

      - name: Run Timesheet Automation
        env:
          TS_USER: ${{ secrets.TS_USER }}
          TS_PASS: ${{ secrets.TS_PASS }}
          TS_DISPLAY_NAME: ${{ secrets.TS_DISPLAY_NAME }}
          TASK_SOURCE_URL: ${{ secrets.TASK_SOURCE_URL }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python timesheet.py hide
